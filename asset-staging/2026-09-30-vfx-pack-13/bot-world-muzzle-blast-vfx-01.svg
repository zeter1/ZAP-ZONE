      <animateTransform attributeName="transform" type="scale" values=".4 .7;1 .9;.66 .72;.2 .5" dur=".38s" repeatCount="indefinite"/>
    </path>
  </g>

  <ellipse cx="24" rx="18" ry="34" fill="none" stroke="#ffe99a" stroke-width="7" opacity=".82">
    <animate attributeName="rx" values="12;44;82" dur=".38s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="18;64;112" dur=".38s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="8;4;1" dur=".38s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".9;.34;0" dur=".38s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="none" stroke-linecap="round" filter="url(#mb-glow)">
