<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="mb-flame" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fffef1"/>
    <stop offset=".18" stop-color="#fff6a5"/>
    <stop offset=".52" stop-color="#ffb52f" stop-opacity=".96"/>
    <stop offset=".82" stop-color="#ff5d18" stop-opacity=".76"/>
    <stop offset="1" stop-color="#ff2e0a" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="mb-core">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".28" stop-color="#fff6bd"/>
    <stop offset=".65" stop-color="#ffb737" stop-opacity=".9"/>
    <stop offset="1" stop-color="#ff5a14" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="mb-smoke">
    <stop offset="0" stop-color="#b7b2aa" stop-opacity=".42"/>
    <stop offset=".55" stop-color="#666a6e" stop-opacity=".28"/>
    <stop offset="1" stop-color="#25292e" stop-opacity="0"/>
  </radialGradient>
  <filter id="mb-glow" x="-80%" y="-80%" width="280%" height="280%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="mb-soft" x="-80%" y="-80%" width="280%" height="280%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<g transform="translate(112 256)">
