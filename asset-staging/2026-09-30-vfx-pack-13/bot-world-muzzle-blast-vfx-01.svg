    <animate attributeName="ry" values="8;31;17;5" dur=".38s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;.72;0" dur=".38s" repeatCount="indefinite"/>
  </ellipse>

  <g filter="url(#mb-glow)">
    <path d="M18 -10 C78 -54 166 -62 310 -28 C226 -9 158 4 26 12 Z" fill="url(#mb-flame)">
      <animate attributeName="opacity" values="0;1;.8;0" dur=".38s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values=".35 .55;1 1;.72 .82;.25 .45" dur=".38s" repeatCount="indefinite"/>
    </path>
    <path d="M17 4 C90 5 174 28 284 66 C191 43 104 34 25 20 Z" fill="url(#mb-flame)" opacity=".78">
