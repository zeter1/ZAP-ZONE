    </path>
    <path d="M26 5 C124 62 220 94 328 102" stroke="#ffb539" stroke-width="5" stroke-dasharray="24 260">
      <animate attributeName="stroke-dashoffset" values="22;-228" dur=".38s" begin=".02s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.86;.44;0" dur=".38s" repeatCount="indefinite"/>
