<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none">
  <defs>
    <radialGradient id="crit-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset=".18" stop-color="#fff1a3"/>
      <stop offset=".48" stop-color="#ffbd2e"/>
      <stop offset=".78" stop-color="#ff6a12" stop-opacity=".68"/>
      <stop offset="1" stop-color="#ff4a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crit-ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffbd7"/>
      <stop offset=".34" stop-color="#ffd54f"/>
      <stop offset=".72" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ff4f18" stop-opacity=".2"/>
