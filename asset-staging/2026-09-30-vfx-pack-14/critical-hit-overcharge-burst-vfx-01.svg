    <linearGradient id="crit-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eaffff"/>
      <stop offset=".5" stop-color="#65efff"/>
      <stop offset="1" stop-color="#28a8ff" stop-opacity=".15"/>
