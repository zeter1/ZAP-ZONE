name: Validate

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "index.html"
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        shell: bash
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check scripts/validate-structure.mjs
      - name: Project structure
        run: node scripts/validate-structure.mjs

      - name: Browser boot smoke test
        shell: bash
        run: |
          python3 -m http.server 8000 > /tmp/zap-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              break
            fi
            sleep 0.25
          done

          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "Chrome/Chromium is not installed on the runner."
            exit 1
          fi

          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --enable-unsafe-swiftshader \
            --ignore-gpu-blocklist \
            --virtual-time-budget=15000 \
            --dump-dom http://127.0.0.1:8000/ \
            > /tmp/zap-dom.html 2> /tmp/zap-chrome.log

          if ! grep -q 'data-zap-boot="ready"' /tmp/zap-dom.html; then
            echo "Game did not reach the boot-ready marker."
            echo "--- Chrome log ---"
            cat /tmp/zap-chrome.log
            echo "--- DOM tail ---"
            tail -n 80 /tmp/zap-dom.html
            exit 1
          fi

          echo "Browser boot smoke test passed."

      - name: Local file menu smoke test
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "Chrome/Chromium is not installed on the runner."
            exit 1
          fi

          profile_dir="$(mktemp -d)"
          "$chrome"             --headless=new             --no-sandbox             --disable-dev-shm-usage             --enable-webgl             --enable-unsafe-swiftshader             --ignore-gpu-blocklist             --remote-debugging-port=9222             --remote-allow-origins='*'             --user-data-dir="$profile_dir"             "file://$GITHUB_WORKSPACE/index.html"             > /tmp/zap-file-chrome.out 2> /tmp/zap-file-chrome.log &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true; rm -rf "$profile_dir"' EXIT

          if ! timeout 20s node scripts/browser-menu-smoke.mjs; then
            echo "--- local-file Chrome log ---"
            cat /tmp/zap-file-chrome.log || true
            exit 1
          fi

          echo "Local file menu smoke test passed."
