name: Validate

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "version.json"
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "index.html"
      - "version.json"
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: JavaScript syntax
        shell: bash
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check scripts/validate-structure.mjs
          node --check scripts/stamp-web-build.mjs
          node --check scripts/projectile-ricochet.test.mjs
          node --check scripts/engine-wall-geometry-owner.test.mjs
          node --check scripts/frontline-owner.test.mjs
          node --check scripts/bot-presentation-owner.test.mjs
          node --check scripts/bot-navigation-owner.test.mjs
          node --check scripts/bot-progression-scaling-owner.test.mjs
          node --check scripts/bot-perception-owner.test.mjs
          node --check scripts/bot-damage-reaction-owner.test.mjs
          node --check scripts/bot-suppression-response-owner.test.mjs
          node --check scripts/bot-dodge-response-owner.test.mjs
          node --check scripts/bot-positioning-owner.test.mjs
          node --check scripts/bot-cover-execution-owner.test.mjs
          node --check scripts/bot-engagement-movement-owner.test.mjs
          node --check scripts/bot-weapon-policy-owner.test.mjs
          node --check scripts/bot-fire-control-owner.test.mjs
          node --check scripts/bot-fire-cadence-owner.test.mjs
          node --check scripts/bot-state-policy-owner.test.mjs
          node --check scripts/bot-deployables-owner.test.mjs
          node --check scripts/browser-boot-smoke.mjs
      - name: Web build stamp
        run: node scripts/stamp-web-build.mjs --check
      - name: Project structure
        run: node scripts/validate-structure.mjs
      - name: Wall geometry owner regressions
        run: node --test scripts/engine-wall-geometry-owner.test.mjs
      - name: Projectile ricochet regressions
        run: node --test scripts/projectile-ricochet.test.mjs
      - name: Frontline owner regressions
        run: node --test scripts/frontline-owner.test.mjs
      - name: Bot presentation regressions
        run: node --test scripts/bot-presentation-owner.test.mjs
      - name: Bot progression-scaling regressions
        run: node --test scripts/bot-progression-scaling-owner.test.mjs
      - name: Bot perception regressions
        run: node --test scripts/bot-perception-owner.test.mjs
      - name: Bot damage-reaction regressions
        run: node --test scripts/bot-damage-reaction-owner.test.mjs
      - name: Bot suppression-response regressions
        run: node --test scripts/bot-suppression-response-owner.test.mjs
      - name: Bot dodge-response regressions
        run: node --test scripts/bot-dodge-response-owner.test.mjs
      - name: Bot navigation regressions
        run: node --test scripts/bot-navigation-owner.test.mjs
      - name: Bot positioning regressions
        run: node --test scripts/bot-positioning-owner.test.mjs
      - name: Bot cover-execution regressions
        run: node --test scripts/bot-cover-execution-owner.test.mjs
      - name: Bot engagement-movement regressions
        run: node --test scripts/bot-engagement-movement-owner.test.mjs
      - name: Bot weapon-policy regressions
        run: node --test scripts/bot-weapon-policy-owner.test.mjs
      - name: Bot fire-control regressions
        run: node --test scripts/bot-fire-control-owner.test.mjs
      - name: Bot fire-cadence regressions
        run: node --test scripts/bot-fire-cadence-owner.test.mjs
      - name: Bot state-policy regressions
        run: node --test scripts/bot-state-policy-owner.test.mjs
      - name: Bot deployables regressions
        run: node --test scripts/bot-deployables-owner.test.mjs

      - name: Browser boot smoke test
        shell: bash
        run: |
          python3 -m http.server 8000 > /tmp/zap-http.log 2>&1 &
          server_pid=$!
          profile_dir="$(mktemp -d)"
          chrome_pid=''
          trap 'kill "$chrome_pid" "$server_pid" 2>/dev/null || true; wait "$chrome_pid" "$server_pid" 2>/dev/null || true; rm -rf "$profile_dir" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              break
            fi
            sleep 0.25
          done

          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "Chrome/Chromium is not installed on the runner."
            exit 1
          fi

          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --enable-unsafe-swiftshader \
            --ignore-gpu-blocklist \
            --window-size=1280,900 \
            --remote-debugging-port=9222 \
            --remote-allow-origins='*' \
            --user-data-dir="$profile_dir" \
            "http://127.0.0.1:8000/" \
            > /tmp/zap-http-chrome.out 2> /tmp/zap-http-chrome.log &
          chrome_pid=$!

          if ! ZAP_CDP_WAIT_MS=15000 timeout 40s node scripts/browser-boot-smoke.mjs; then
            echo "--- CDP diagnostics ---"
            ps -p "$chrome_pid" -o pid=,stat=,etime=,cmd= || true
            curl -fsS http://127.0.0.1:9222/json/version || true
            curl -fsS http://127.0.0.1:9222/json/list || true
            echo "--- HTTP Chrome log ---"
            tail -n 120 /tmp/zap-http-chrome.log || true
            exit 1
          fi

          echo "Browser boot smoke test passed."

      - name: Local file menu smoke test
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "Chrome/Chromium is not installed on the runner."
            exit 1
          fi

          profile_dir="$(mktemp -d)"
          "$chrome"             --headless=new             --no-sandbox             --disable-dev-shm-usage             --enable-webgl             --enable-unsafe-swiftshader             --ignore-gpu-blocklist             --window-size=1280,900             --remote-debugging-port=9222             --remote-allow-origins='*'             --user-data-dir="$profile_dir"             "file://$GITHUB_WORKSPACE/index.html"             > /tmp/zap-file-chrome.out 2> /tmp/zap-file-chrome.log &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true; wait "$chrome_pid" 2>/dev/null || true; rm -rf "$profile_dir" 2>/dev/null || true' EXIT

          if ! ZAP_CDP_WAIT_MS=15000 timeout 35s node scripts/browser-menu-smoke.mjs; then
            echo "--- local-file CDP diagnostics ---"
            ps -p "$chrome_pid" -o pid=,stat=,etime=,cmd= || true
            curl -fsS http://127.0.0.1:9222/json/version || true
            curl -fsS http://127.0.0.1:9222/json/list || true
            echo "--- local-file Chrome log ---"
            cat /tmp/zap-file-chrome.log || true
            exit 1
          fi

          echo "Local file menu smoke test passed."
