name: Validate

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "index.html"
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        shell: bash
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check scripts/validate-structure.mjs
      - name: Project structure
        run: node scripts/validate-structure.mjs
